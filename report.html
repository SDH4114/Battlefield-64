<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Battlefield 64 - Report Bug</title>
  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="icon" type="image/png" href="./logoBrow.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Courier New", monospace;
    }

    .report-container {
      max-width: 600px;
      margin: 40px auto;
      background: rgba(10, 12, 40, 0.85);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 0, 200, 0.25);
      color: #fff;
    }

    .report-container h1 {
      margin-bottom: 12px;
      font-size: 28px;
    }

    .form-row {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .form-row input,
    .form-row textarea {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(20, 20, 60, 0.85);
      color: #fff;
    }

    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid #ff78ff;
      background: linear-gradient(90deg, #ff55ff, #66ccff);
      cursor: pointer;
      font-size: 18px;
      color: #fff;
    }

    #status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 16px;
    }

    .back-btn {
      margin-top: 20px;
      display: inline-block;
      color: #66ccff;
    }
  </style>
</head>

<body>
  <div class="report-container">
    <h1>Report a Bug</h1>
    <p>If you found a bug, please describe it below.</p>

    <form id="bug-report-form"
          class="contact-form"
          action="https://formsubmit.co/chaos.net2000@gmail.com"
          method="POST"
          enctype="multipart/form-data">

      <!-- Настройки FormSubmit -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="box">
      <input type="hidden" name="_next" value="report.html">
      <input type="hidden" name="_next" value="https://sdh4114.github.io/Battlefield-64/report.html">

      <div class="form-row">
        <label>Your name:</label>
        <input type="text" name="name" required>
      </div>

      <div class="form-row">
        <label>Your email:</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-row">
        <label>Bug description:</label>
        <textarea name="message" rows="5" required></textarea>
      </div>

      <div class="form-row">
        <label>Screenshot:</label>
        <input type="file" name="attachment" accept="image/*">
      </div>

      <button type="submit">Submit Bug Report</button>

      <!-- сюда будет писать "Sending..." -->
      <p id="status"></p>
    </form>

    <a href="chess.html" class="back-btn">← Back to game</a>
  </div>

  <script src="./src/js/sys.js" defer></script>
</body>
</html>
