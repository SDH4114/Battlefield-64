<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Battlefield 64</title>
  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="stylesheet" href="./src/css/index.css" />
  <link rel="icon" type="image/png" sizes="512x512" href="./logoBrow.png" />
  <link rel="shortcut icon" type="image/png" href="./logoBrow.png" />
  <meta name="viewport" content="width=device-width, initial-scale=0.9, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- логотип -->
    <div class="logo-section">
      <img src="logoV2.png" alt="Battlefield 64 Logo" class="logo-img" onerror="this.style.display='none'">
      <h1 class="logo-text">Battlefield 64</h1>
      <p class="tagline">Strategic Chess Combat</p>
    </div>

    <!-- меню -->
    <div class="main-menu">
      <div class="menu-buttons">
        <button class="menu-btn primary" onclick="location.href='chess.html'">
          <span>Start Game</span>
        </button>
        <button class="menu-btn primary" id="play-bot-btn">
          <span>Play with bot</span>
        </button>
        
        <button class="menu-btn" onclick="location.href='tutorial.html'">
          <span>Rules & Tutorial</span>
        </button>
        
        <button class="menu-btn" onclick="location.href='report.html'">
          <span>Report a Bug</span>
        </button>
        
        <button class="menu-btn" onclick="alert('Feature in development!')">
          <span>Leaderboard</span>
        </button>
        
        <button class="menu-btn" onclick="alert('Coming soon!')">
          <span>Multiplayer</span>
        </button>

        <button class="menu-btn" onclick="location.href='https://github.com/SDH4114/Battlefield-64'">
          <span>Repository</span>
        </button>
      </div>

      <!-- настройки -->
      <div class="settings-section">
        <h2 class="settings-title">Settings</h2>
        
        <div class="setting-item">
          <span class="setting-label">Sound effects (в разработке)</span>
          <div class="toggle-switch active" onclick="toggleSetting(this, 'sound')"></div>
        </div>
        
        <div class="setting-item">
          <span class="setting-label">Move highlights</span>
          <div class="toggle-switch active" onclick="toggleSetting(this, 'hints')"></div>
        </div>
        
        <div class="setting-item">
          <span class="setting-label">Piece animations</span>
          <div class="toggle-switch active" onclick="toggleSetting(this, 'animation')"></div>
        </div>
        
        <div class="setting-item">
          <span class="setting-label">Opponent difficulty</span>
          <div class="select-wrapper">
            <select class="custom-select" id="difficulty" onchange="saveSetting('difficulty', this.value)">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
              <option value="expert">Expert</option>
            </select>
          </div>
        </div>
        
        <div class="setting-item">
          <span class="setting-label">Piece style</span>
          <div class="select-wrapper">
            <select class="custom-select" id="theme" onchange="saveSetting('theme', this.value)">
              <option value="basic" selected>Basic (cyan/pink)</option>
              <option value="classic">Classic (black/white)</option>
              <option value="universal" disabled>Universal (в разработке)</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Footer -->
      <div class="footer">        
        <div class="social-links">
          <a href="https://discord.gg/rdFjmqaW6" class="social-link" title="Discord">Discord</a>
          <a href="https://github.com/SDH4114" class="social-link" title="GitHub">GitHub</a>
          <a href="https://t.me/sdhaos4114" class="social-link" title="Telegram">Telegram</a>
          <a href="https://t.me/BreakLoop" class="social-link" title="BreakLoop">BreakLoop</a>
        </div>
        <p>© 2025 Battlefield 64. All rights reserved.</p>
        <p>Version 1.0.6</p>

      </div>
    </div>
  </div>

  <script>
    // загрузка настроек из localStorage
    function loadSettings() {
      const sound = localStorage.getItem('sound') !== 'false';
      const hints = localStorage.getItem('hints') !== 'false';
      const animation = localStorage.getItem('animation') !== 'false';
      const difficulty = localStorage.getItem('difficulty') || 'medium';
      const storedTheme = localStorage.getItem('theme');
      const theme = storedTheme && ['basic','classic'].includes(storedTheme) ? storedTheme : 'basic';
      if (theme !== storedTheme) {
        localStorage.setItem('theme', theme);
      }

      // применяем сохраненные настройки
      document.querySelectorAll('.toggle-switch')[0].classList.toggle('active', sound);
      document.querySelectorAll('.toggle-switch')[1].classList.toggle('active', hints);
      document.querySelectorAll('.toggle-switch')[2].classList.toggle('active', animation);
      document.getElementById('difficulty').value = difficulty;
      document.getElementById('theme').value = theme;
    }

    // переключение настроек
    function toggleSetting(element, setting) {
      element.classList.toggle('active');
      const isActive = element.classList.contains('active');
      localStorage.setItem(setting, isActive);
      
      // визуальная обратная связь
      element.style.transform = 'scale(0.95)';
      setTimeout(() => {
        element.style.transform = 'scale(1)';
      }, 100);
    }

    // сохранение выбора из select
    function saveSetting(setting, value) {
      localStorage.setItem(setting, value);

      // визуальная обратная связь
      const select = event.target;
      select.style.transform = 'scale(0.98)';
      setTimeout(() => {
        select.style.transform = 'scale(1)';
      }, 100);
    }

    // загружаем настройки при загрузке страницы
    window.addEventListener('DOMContentLoaded', loadSettings);

    // анимация появления кнопок
    const buttons = document.querySelectorAll('.menu-btn');
    buttons.forEach((btn, index) => {
      btn.style.animation = `fadeInUp 0.6s ease-out ${0.1 * index}s both`;
    });

    // добавляем звуковые эффекты при наведении (опционально)
    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        if (localStorage.getItem('sound') !== 'false') {
          // может быть звук добавлю
          // new Audio('hover.mp3').play();
        }
      });
    });

    // игра против бота с выбранной сложностью
    const playBotBtn = document.getElementById('play-bot-btn');
    if (playBotBtn) {
      playBotBtn.addEventListener('click', () => {
        const difficulty = document.getElementById('difficulty')?.value || 'medium';
        localStorage.setItem('difficulty', difficulty);
        window.location.href = 'botChess.html';
      });
    }
  </script>
</body>
</html>
